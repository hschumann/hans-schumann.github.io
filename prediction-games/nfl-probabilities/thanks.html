<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank you — NFL Probabilities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>

<header class="navbar">
  <nav class="nav-container container">
    <a href="../../index.html" class="logo" aria-label="Home">
      <img src="../../images/logo.png" alt="Hans Schumann logo" />
    </a>
    <details class="nav-menu">
      <summary class="nav-menu-toggle" aria-label="Menu">
        <span class="nav-menu-label">Menu</span>
        <span class="nav-menu-icon" aria-hidden="true"></span>
      </summary>
      <ul class="nav-links">
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../../analytics/index.html">Analytics</a></li>
        <li><a href="../index.html">Prediction Games</a></li>
        <li><a href="../../contact/index.html">Contact</a></li>
      </ul>
    </details>
  </nav>
</header>

<main class="container">
  <section class="hero">
    <div class="kicker">NFL &bull; prediction game</div>
    <h1>Thank you for playing!</h1>
    <p class="muted">
      Your predictions are in<span id="user-thanks"></span><span id="week-thanks"></span>.
      Come back anytime with the same username to edit unlocked games.
    </p>
    <div class="button-row">
      <a class="btn primary" id="link-others" href="others.html">Others&rsquo; Predictions</a>
      <a class="btn primary" id="link-leaderboard" href="leaderboard.html">Leaderboard</a>
    </div>
    <div class="button-row">
      <a class="btn" id="link-edit" href="play.html">Edit my predictions</a>
      <a class="btn" href="index.html">Switch user</a>
    </div>
  </section>
</main>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var user = (params.get("user") || sessionStorage.getItem("nfl-probabilities-username") || "").trim();
    var week = params.get("week") || "";

    if (!user) {
      window.location.replace("index.html");
      return;
    }

    sessionStorage.setItem("nfl-probabilities-username", user);

    var userEl = document.getElementById("user-thanks");
    var weekEl = document.getElementById("week-thanks");
    userEl.textContent = ", " + user;
    if (week) {
      weekEl.textContent = " for Week " + week;
    }

    var q = "?user=" + encodeURIComponent(user) + (week ? "&week=" + encodeURIComponent(week) : "");
    document.getElementById("link-others").href = "others.html" + q;
    document.getElementById("link-leaderboard").href = "leaderboard.html" + q;
    document.getElementById("link-edit").href = "play.html" + q;
  })();
</script>

<script src="../../nav.js"></script>
</body>
</html>
