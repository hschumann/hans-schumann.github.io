<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>

<header class="navbar">
  <nav class="nav-container container">
    <a href="../../index.html" class="logo" aria-label="Home">
      <img src="../../images/logo.png" alt="Hans Schumann logo" />
    </a>
    <details class="nav-menu">
      <summary class="nav-menu-toggle" aria-label="Menu">
        <span class="nav-menu-label">Menu</span>
        <span class="nav-menu-icon" aria-hidden="true"></span>
      </summary>
      <ul class="nav-links">

    <div class="button-row">
      <a class="btn primary" id="link-leaderboard" href="leaderboard.html">Leaderboard</a>

  <section class="section stack">
    <p id="others-status" class="game-status" hidden></p>
    <div class="gold-plan-table-wrapper others-table-wrapper">
      <table class="gold-plan-table others-table" id="others-table">

        <thead id="others-thead"></thead>
