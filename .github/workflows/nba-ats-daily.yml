name: NBA ATS daily picks

on:
  workflow_dispatch:
  schedule:
    # ~8:00 AM America/New_York (EDT=12:00 UTC, EST=13:00 UTC).
    # Run both; the job is cheap and idempotent.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NBA_model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync + compute picks + email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: hansschumann24@gmail.com
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PREFERRED_BOOK: draftkings
          ATS_LOOKBACK_DAYS: "7"
          TOP_N_PICKS: "3"
          TIMEZONE: America/New_York
        run: python3 scripts/run_daily.py

      - name: Commit data artifacts if changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            NBA_model/data/nba_ats.db \
            NBA_model/data/games.csv \
            NBA_model/data/latest_picks.json \
            betting-models/nba-ats/picks.json || true
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Update NBA ATS daily data and picks"
            git push
          fi
